type Organization
  @model
  @auth(
    rules: [
      { allow: owner, ownerField: "creatorId" }
      { allow: private, operations: [read] }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  name: String!
  description: String
  logo: String
  phone: AWSPhone
  email: AWSEmail
  website: String
  isVerified: Boolean! @default(value: "false")
  creatorId: ID! @index(name: "byCreatorId")
  creator: User! @belongsTo(fields: ["creatorId"])
  members: [User] @manyToMany(relationName: "OrganizationMember")
  mosques: [Mosque] @hasMany(indexName: "byOrganizationId", fields: ["id"])
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

