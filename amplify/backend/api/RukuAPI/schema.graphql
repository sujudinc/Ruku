# ------------------------------------------------------------------------------------- MODELS

type Announcement
  @model(
    mutations: { update: null }
    subscriptions: { onUpdate: null }
  )
  @auth(
    rules: [
      { allow: owner }
      { allow: private, operations: [read] }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  content: AWSJSON!
  images: [String]
  bookmarks: [Bookmark]! @hasMany(indexName: "byAnnouncement", fields: ["id"])
  likes: [Like]! @hasMany(indexName: "byAnnouncement", fields: ["id"])
  comments: [Comment]! @hasMany(indexName: "byAnnouncement", fields: ["id"])
  creatorID: ID! @index(name: "byCreator")
  creator: User! @belongsTo(fields: ["creatorID"])
  mosqueID: ID! @index(name: "byMosque")
  mosque: Mosque! @belongsTo(fields: ["mosqueID"])
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  owner: String @auth(rules: [{ allow: owner, operations: [read, delete] }])
}

type Bookmark
  @model(
    queries: null
    mutations: { update: null }
    subscriptions: { onUpdate: null }
  )
  @auth(
    rules: [
      { allow: owner }
      { allow: private, operations: [read] }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  announcementID: ID! @index(name: "byAnnouncement")
  announcement: Announcement! @belongsTo(fields: ["announcementID"])
  creatorID: ID! @index(name: "byCreator")
  creator: User! @belongsTo(fields: ["creatorID"])
  mosqueID: ID! @index(name: "byMosque")
  mosque: Mosque! @belongsTo(fields: ["mosqueID"])
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  owner: String @auth(rules: [{ allow: owner, operations: [read, delete] }])
}

type Comment
  @model(
    queries: null
    mutations: { update: null }
    subscriptions: { onUpdate: null }
  )
  @auth(
    rules: [
      { allow: owner }
      { allow: private, operations: [read] }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  text: String!
  parentCommentID: ID @index(name: "byParentComment")
  parentComment: Comment @belongsTo(fields: ["parentCommentID"])
  subComments: [Comment]! @hasMany(indexName: "byParentComment", fields: ["id"])
  announcementID: ID! @index(name: "byAnnouncement")
  announcement: Announcement! @belongsTo(fields: ["announcementID"])
  creatorID: ID! @index(name: "byCreator")
  creator: User! @belongsTo(fields: ["creatorID"])
  mosqueID: ID! @index(name: "byMosque")
  mosque: Mosque! @belongsTo(fields: ["mosqueID"])
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  owner: String @auth(rules: [{ allow: owner, operations: [read, delete] }])
}

type Donation
  @model(
    queries: null
    mutations: { update: null }
    subscriptions: { onUpdate: null }
  )
  @auth(
    rules: [
      { allow: owner }
      { allow: private, operations: [read] }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  amount: Float!
  currency: String!
  isAnonymous: Boolean!
  donorID: ID! @index(name: "byDonor")
  donor: User! @belongsTo(fields: ["donorID"])
  fundraisingCampaignID: ID! @index(name: "byFundraisingCampaign")
  fundraisingCampaign: FundraisingCampaign @belongsTo(fields: ["fundraisingCampaignID"])
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  owner: String @auth(rules: [{ allow: owner, operations: [read, delete] }])
}

type FundraisingCampaign
  @model
  @auth(
    rules: [
      { allow: owner, ownerField: "owners"}
      { allow: private, operations: [read] }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  title: String!
  description: String
  featureImage: String
  type: FundraisingCampaignType!
  currentAmount: Float!
  goal: Float!
  goalDate: AWSDateTime!
  currency: String!
  creatorID: ID! @index(name: "byCreator")
  creator: User! @belongsTo(fields: ["creatorID"])
  mosqueID: ID! @index(name: "byMosque")
  mosque: Mosque! @belongsTo(fields: ["mosqueID"])
  donations: [Donation]! @hasMany(indexName: "byFundraisingCampaign", fields: ["id"])
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  owners: [String] @auth(rules: [{ allow: owner }])
}

type Like
  @model(
    queries: null
    mutations: { update: null }
