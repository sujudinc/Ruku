# ------------------------------------------------------------------------------------- CUSTOM TYPES

type Day {
  type: DayType!
  operatingHours: [OperatingHours!]!
}

type Hours {
  monday: Day
  tuesday: Day
  wednesday: Day
  thursday: Day
  friday: Day
  saturday: Day
  sunday: Day
}

type OperatingHours {
  open: AWSTime!
  close: AWSTime!
}

type FardPrayer {
  athan: AWSTime!
  iqamah: AWSTime!
}

type SunnahPrayer {
  start: AWSTime!
  end: AWSTime
}

type SocialMedia {
  facebook: String
  instagram: String
  twitter: String
  youtube: String
}

# ------------------------------------------------------------------------------------- ENUMS

enum DayType {
  MONDAY
  TUESDAY
  WEDNESDAY
  THURSDAY
  FRIDAY
  SATURDAY
  SUNDAY
}

enum FundraisingCampaignType {
  BILL
  COMMUNITY
  EDUCATION
  EMERGENCY_RELIEF
  ENVIRONMENT
  FUNERAL
  HEALTH
  MOSQUE
  ORPHANS
  OTHER
  REFUGEES
}

