type PrayerTime
  @model(
    queries: null
  )
  @auth(
    rules: [
      { allow: owner, ownerField: "owners"}
      { allow: private, operations: [read] }
      { allow: public, operations: [read] }
    ]
  )
  {
  id: ID!
  fajr: FardPrayer!
  dhuhr: FardPrayer!
  asr: FardPrayer!
  maghrib: FardPrayer!
  isha: FardPrayer!
  jummah: [FardPrayer]!
  taraweeh: SunnahPrayer
  eid: [FardPrayer]
  startDate: AWSDateTime!
  timeZone: String!
  createdByUserID: ID! @index(name: "byCreatedByUser")
  createdByUser: User! @belongsTo(fields: ["createdByUserID"])
  updatedByUserID: ID! @index(name: "byUpdatedByUser")
  updatedByUser: User! @belongsTo(fields: ["updatedByUserID"])
  mosqueID: ID! @index(name: "byMosque")
  mosque: Mosque! @belongsTo(fields: ["mosqueID"])
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  owners: [String] @auth(rules: [{ allow: owner }])
}

type Mosque
  @model
  @auth(
    rules: [
      { allow: owner, ownerField: "owners" }
      { allow: private, operations: [read] }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  name: String!
  description: String!
  images: [String!]!
  address: String!
  latitude: Float!
  longitude: Float!
  hours: Hours
  phone: AWSPhone
  email: AWSEmail
  website: String
  socialMedia: SocialMedia
  liveVideoUrl: String
  isVerified: Boolean! @default(value: "false")
  creatorID: ID! @index(name: "byCreator")
  creator: User! @belongsTo(fields: ["creatorID"])
  organizationID: ID @index(name: "byOrganization")
  organization: Organization @belongsTo(fields: ["organizationID"])
  followers: [User]! @manyToMany(relationName: "MosqueFollower")
  announcements: [Announcement]! @hasMany(indexName: "byMosque", fields: ["id"])
  fundraisingCampaigns: [FundraisingCampaign]! @hasMany(indexName: "byMosque", fields: ["id"])
  prayerTimes: [PrayerTime]! @hasMany(indexName: "byMosque", fields: ["id"])
  bookmarks: [Bookmark]! @hasMany(indexName: "byMosque", fields: ["id"])
  likes: [Like]! @hasMany(indexName: "byMosque", fields: ["id"])
  comments: [Comment]! @hasMany(indexName: "byMosque", fields: ["id"])
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  owners: [String] @auth(rules: [{ allow: owner }])
}

type Organization
  @model
  @auth(
    rules: [
      { allow: owner, ownerField: "owners" }
      { allow: private, operations: [read] }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  name: String!
  description: String
  logo: String
  phone: AWSPhone
  email: AWSEmail
  website: String
  isVerified: Boolean! @default(value: "false")
  creatorID: ID! @index(name: "byCreator")
  creator: User! @belongsTo(fields: ["creatorID"])
  members: [User]! @manyToMany(relationName: "OrganizationMember")
  mosques: [Mosque]! @hasMany(indexName: "byOrganization", fields: ["id"])
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
  owners: [String] @auth(rules: [{ allow: owner }])
}

type User
	@model(
    queries: { list: null }
		mutations: { create: null, delete: null }
    subscriptions: { onCreate: null, onDelete: null }
	)
  @auth(
    rules: [
      { allow: owner }
      { allow: private, operations: [read] }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  selfie: String
  firstName: String!
  lastName: String!
  email: AWSEmail!
  phone: AWSPhone
  type: UserType!
  status: UserStatus!
  stripeCustomerId: String
  isOnline: Boolean
  bookmarks: [Bookmark]! @hasMany(indexName: "byCreator", fields: ["id"])
  comments: [Comment]! @hasMany(indexName: "byCreator", fields: ["id"])
  createdAnnouncements: [Announcement]! @hasMany(indexName: "byCreator", fields: ["id"])
  createdFundraisingCampaigns: [FundraisingCampaign]! @hasMany(indexName: "byCreator", fields: ["id"])
  createdPrayerTimes: [PrayerTime]! @hasMany(indexName: "byCreatedByUser", fields: ["id"])
  createdOrganizations: [Organization]! @hasMany(indexName: "byCreator", fields: ["id"])
  createdMosques: [Mosque]! @hasMany(indexName: "byCreator", fields: ["id"])
  donations: [Donation]! @hasMany(indexName: "byDonor", fields: ["id"])
  mosques: [Mosque]! @manyToMany(relationName: "MosqueFollower")
  organizations: [Organization]! @manyToMany(relationName: "OrganizationMember")
  likes: [Like]! @hasMany(indexName: "byCreator", fields: ["id"])
  updatedPrayerTimes: [PrayerTime]! @hasMany(indexName: "byUpdatedByUser", fields: ["id"])
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  owner: String @auth(rules: [{ allow: owner, operations: [read, delete] }])
}

# ------------------------------------------------------------------------------------- CUSTOM TYPES

type Day {
  type: DayType!
  operatingHours: [OperatingHours!]!
}

type Hours {
  monday: Day
  tuesday: Day
  wednesday: Day
  thursday: Day
  friday: Day
  saturday: Day
  sunday: Day
}

type OperatingHours {
  open: AWSTime!
  close: AWSTime!
}

type FardPrayer {
  athan: AWSTime!
  iqamah: AWSTime!
}

type SunnahPrayer {
  start: AWSTime!
  end: AWSTime
}

type SocialMedia {
  facebook: String
  instagram: String
  twitter: String
  youtube: String
}

# ------------------------------------------------------------------------------------- ENUMS

enum DayType {
  MONDAY
  TUESDAY
  WEDNESDAY
  THURSDAY
  FRIDAY
  SATURDAY
  SUNDAY
}

enum FundraisingCampaignType {
  BILL
  COMMUNITY
  EDUCATION
  EMERGENCY_RELIEF
  ENVIRONMENT
  FUNERAL
  HEALTH
  MOSQUE
  ORPHANS
  OTHER
  REFUGEES
}

enum UserStatus {
  ACTIVE
  BLOCKED
  DEACTIVATED
}

enum UserType {
  ADMIN
  SUPER_ADMIN
  USER
  USER_READ_ONLY
}
